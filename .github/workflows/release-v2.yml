name: Release Sage v2

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish frozen Sage 2.1.1 after Intel package verification
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-v2-2.1.1-frozen-intel
  cancel-in-progress: false

env:
  SAGE_RELEASE_COMMIT: ec5cde4fcba5d458dac65315e75f25c436d0b306

jobs:
  desktop:
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec5cde4fcba5d458dac65315e75f25c436d0b306
      - uses: actions/download-artifact@v4
        with:
          name: sage-v2-packages
          run-id: 39246580267
          github-token: ${{ github.token }}
          path: python-packages
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install managed relocatable Python
        run: uv python install 3.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Apply Intel packaging constraint without changing Sage source
        run: |
          test "$(git rev-parse HEAD)" = "$SAGE_RELEASE_COMMIT"
          printf '\n%s\n' 'PyMuPDF==1.28.2; sys_platform == "darwin" and platform_machine == "x86_64"' >> scripts/release/desktop-constraints.txt
      - name: Verify Flutter client
        working-directory: app/v2/desktop
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Flutter v2 client
        working-directory: app/v2/desktop
        run: flutter build macos --release --build-name=2.1.1 --build-number=1
      - name: Bundle, relocate and verify Desktop v2
        run: python scripts/release/package_desktop_v2.py --platform macos --arch x86_64 --commit "$SAGE_RELEASE_COMMIT" --wheel python-packages/sage-2.1.1-py3-none-any.whl --out release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: sage-v2-desktop-macos-x86_64
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: desktop
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec5cde4fcba5d458dac65315e75f25c436d0b306
      - uses: actions/download-artifact@v4
        with:
          pattern: sage-v2-*
          run-id: 39246580267
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sage-v2-desktop-macos-x86_64
          path: release-assets
      - name: Verify all frozen source assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$SAGE_RELEASE_COMMIT"
          python scripts/release/check_v2_release.py --assets release-assets --complete
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          cp release_notes/v2.1.1.md /tmp/sage-release-notes.md
          printf '\n%s\n' 'Build note: Sage source is frozen at ec5cde4fc. The macOS Intel packaging environment pins PyMuPDF 1.28.2 to use its compatible prebuilt wheel; the other four verified platform packages are reused from run 39246580267.' >> /tmp/sage-release-notes.md
          gh release create v2.1.1 release-assets/* --target "$SAGE_RELEASE_COMMIT" --title 'Sage 2.1.1' --notes-file /tmp/sage-release-notes.md --latest
