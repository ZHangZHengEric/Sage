name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Source architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/shared/checks/check_architecture.py

  python-tests:
    needs: architecture
    name: Pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: app-v1
            path: tests/app/v1
            environment: v1
          - suite: sagents-v1
            path: tests/sagents/v1
            environment: v1
          - suite: app-v2
            path: tests/app/v2
            environment: v2
          - suite: sagents-v2
            path: tests/sagents/v2
            environment: v2
          - suite: mcp
            path: tests/mcp_servers
            environment: v1
          - suite: cross-version
            path: tests/app/clients tests/sagents --ignore=tests/sagents/v1 --ignore=tests/sagents/v2
            environment: combined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            app/v1/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Sandbox Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu runners restrict unprivileged user namespaces. Prepare the
          # disposable runner as upstream bubblewrap does for its native tests.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          python - <<'PYTHON'
          import subprocess
          help_text = subprocess.check_output(["bwrap", "--help"], text=True)
          required = ("--bind-fd", "--ro-bind-fd", "--disable-userns", "--seccomp")
          missing = [flag for flag in required if flag not in help_text]
          if missing:
              raise SystemExit(f"bubblewrap lacks required sandbox capabilities: {missing}")
          subprocess.run(["bwrap", "--unshare-all", "--unshare-user", "--disable-userns",
                          "--ro-bind", "/", "/", "--", "/usr/bin/true"], check=True)
          PYTHON

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.environment }}" = "v1" ]; then
            python -m pip install -r app/v1/requirements-test.txt
          elif [ "${{ matrix.environment }}" = "v2" ]; then
            python -m pip install -e '.[server-v2,desktop-v2,otel,test]'
          else
            python -m pip install -r app/v1/requirements-test.txt -e '.[server-v2,desktop-v2,otel,test]'
          fi
          python -m pip check

      - name: Run Pytest Suite
        # The Linux sandbox binds the workspace at its own workspace_root, and
        # /tmp is where the sandbox mounts its scratch. A default pytest tmp_path
        # therefore cannot be a host-path workspace; put temporaries elsewhere.
        run: python -m pytest ${{ matrix.path }} -m 'not live' -v --basetemp="${{ runner.temp }}/pytest"

  web-tests:
    name: Web Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/v1/server/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/v1/server/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Check Frontend I18n Literals
        run: npm run check:i18n

      - name: Run Vitest
        run: npm test -- --run

  desktop-i18n:
    name: Desktop UI i18n keys
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/v1/desktop/ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/v1/desktop/ui/package-lock.json

      - name: Install Desktop UI Dependencies
        run: npm ci

      - name: Check Desktop i18n keys (zh / en)
        run: npm run check:i18n

  web-v2:
    name: Server v2 Web build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/v2/server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/v2/server/web/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop-v2:
    name: Desktop v2 Flutter checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/v2/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
