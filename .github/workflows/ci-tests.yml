name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Source architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/shared/checks/check_architecture.py

  python-smoke:
    name: Python recovery smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/shared/checks/requirements-ci-smoke.txt
      - run: python -m pip install -r scripts/shared/checks/requirements-ci-smoke.txt
      - name: Contracts and provider state
        run: python -m pytest -q tests/sagents/v2/test_contracts_matrix.py tests/sagents/v2/test_provider_state_contract_matrix.py --durations=5
      - name: Model error classification and bounded recovery
        run: >-
          python -m pytest -q tests/sagents/v2/test_model_recovery_policy.py
          -k 'failure_mapping or provider_independent_termination or empty_has_exactly_one_guided_attempt or execution_barrier_prevents_recovery or retry_after_is_minimum_and_deadline_wins or legacy_config_defaults_are_finite_and_conflicts_rejected or truncated_response_never_executes_even_parseable_tool_arguments or gemini_daily_quota_is_not_transient_rate_limit'
          --durations=5

  python-tests:
    if: github.event_name == 'workflow_dispatch'
    needs: architecture
    name: Pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: app-v1
            path: tests/app/v1
            environment: v1
          - suite: sagents-v1
            path: tests/sagents/v1
            environment: v1
          - suite: app-v2-1
            path: tests/app/v2
            environment: v2
            shard_args: -p scripts.shared.checks.pytest_shard --ci-shard=1/4
          - suite: app-v2-2
            path: tests/app/v2
            environment: v2
            shard_args: -p scripts.shared.checks.pytest_shard --ci-shard=2/4
          - suite: app-v2-3
            path: tests/app/v2
            environment: v2
            shard_args: -p scripts.shared.checks.pytest_shard --ci-shard=3/4
          - suite: app-v2-4
            path: tests/app/v2
            environment: v2
            shard_args: -p scripts.shared.checks.pytest_shard --ci-shard=4/4
          - suite: sagents-v2
            path: tests/sagents/v2
            environment: v2
          - suite: mcp
            path: tests/mcp_servers
            environment: v1
          - suite: cross-version
            path: tests/app/clients tests/sagents --ignore=tests/sagents/v1 --ignore=tests/sagents/v2
            environment: combined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            app/v1/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Sandbox Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu runners restrict unprivileged user namespaces. Prepare the
          # disposable runner as upstream bubblewrap does for its native tests.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          python - <<'PYTHON'
          import subprocess
          help_text = subprocess.check_output(["bwrap", "--help"], text=True)
          required = ("--bind-fd", "--ro-bind-fd", "--disable-userns", "--seccomp")
          missing = [flag for flag in required if flag not in help_text]
          if missing:
              raise SystemExit(f"bubblewrap lacks required sandbox capabilities: {missing}")
          subprocess.run(["bwrap", "--unshare-all", "--unshare-user", "--disable-userns",
                          "--ro-bind", "/", "/", "--", "/usr/bin/true"], check=True)
          PYTHON

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.environment }}" = "v1" ]; then
            python -m pip install -r app/v1/requirements-test.txt
          elif [ "${{ matrix.environment }}" = "v2" ]; then
            python -m pip install -e '.[server,desktop,otel,test,tau-bench]'
          else
            python -m pip install -r app/v1/requirements-test.txt -e '.[server,desktop,otel,test,tau-bench]'
          fi
          python -m pip check

      - name: Install Sage lint runtime
        if: matrix.environment != 'v1'
        run: npm ci --prefix sagents/v2/tool/official/lint --ignore-scripts --no-audit --no-fund

      - name: Run Pytest Suite
        # The Linux sandbox binds the workspace at its own workspace_root, and
        # /tmp is where the sandbox mounts its scratch. A default pytest tmp_path
        # therefore cannot be a host-path workspace; put temporaries elsewhere.
        run: python -m pytest ${{ matrix.path }} ${{ matrix.shard_args }} -m "not live" -v --durations=20 --durations-min=1 --basetemp="${{ runner.temp }}/pytest"

  app-v2-checks:
    # Retain the existing required-check name after splitting the matrix entry.
    name: Pytest (app-v2)
    needs: python-tests
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.python-tests.result }}" = success

  web-tests:
    name: Web Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/v1/server/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/v1/server/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Check Frontend I18n Literals
        run: npm run check:i18n

      - name: Run Vitest
        run: npm test -- --run

  desktop-i18n:
    name: Desktop UI i18n keys
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/v1/desktop/ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/v1/desktop/ui/package-lock.json

      - name: Install Desktop UI Dependencies
        run: npm ci

      - name: Check Desktop i18n keys (zh / en)
        run: npm run check:i18n

  web-v2:
    name: Server v2 Web build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/v2/server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/v2/server/web/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop-v2:
    if: github.event_name == 'workflow_dispatch'
    name: Desktop v2 Flutter checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/v2/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  postgres-tests:
    if: github.event_name == 'workflow_dispatch'
    name: MySQL and PostgreSQL storage parity
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sage-test-root-password
          MYSQL_DATABASE: sage_test
          MYSQL_USER: sage
          MYSQL_PASSWORD: sage-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.12
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage-test-password
          POSTGRES_DB: sage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage -d sage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAGE_V2_TEST_POSTGRES_DSN: postgresql://sage:sage-test-password@localhost:5432/sage_test
      SAGE_V2_TEST_MYSQL_DSN: mysql://sage:sage-test-password@localhost:3306/sage_test
      SAGE_V2_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Enable required Redis durability
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET appendonly yes
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction
      - run: python -m pip install -e '.[server,postgres,test]'
      - name: Verify PostgreSQL runtime and Server contracts
        run: >-
          python -m pytest tests/sagents/v2/test_postgres_session_store.py
          tests/sagents/v2/test_postgres_connection_budget.py
          tests/sagents/v2/test_postgres_archive_guard.py
          tests/sagents/v2/test_redis_guard_cleanup.py
          tests/sagents/v2/test_sql_backend_feature_parity.py
          tests/sagents/v2/test_redis_mysql_session_store.py
          tests/sagents/v2/test_distributed_redis_mysql_session_store.py
          tests/sagents/v2/test_mysql_incremental_archive.py
          tests/sagents/v2/test_sql_session_store_contract.py
          tests/app/v2/server/test_postgres_configuration.py
          tests/app/v2/server/test_mysql_image_run.py
          tests/app/v2/server/test_distributed_runtime_configuration.py
          -q --basetemp="${{ runner.temp }}/pytest"
