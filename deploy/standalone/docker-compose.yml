x-sage-observability-labels: &sage-observability-labels
  com.sage.environment: ${SAGE_OBSERVABILITY_ENV:-${SAGE_ENV:-production}}

services:
  sage-server:
    restart: always
    init: true
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.server
    image: sage-server-standalone:v1.0
    container_name: sage-server_v2
    volumes:
      - ${SAGE_ROOT}/sage-server/sessions:/app/sessions
      - ${SAGE_ROOT}/sage-server/agents:/app/agents
      - ${SAGE_ROOT}/sage-server/logs:/app/logs
      - ${SAGE_ROOT}/sage-server/data:/app/data
      - ${SAGE_ROOT}/sage-server/skills:/app/skills
      - ${SAGE_ROOT}/sage-server/users:/app/users
    ports:
      - ${SAGE_SERVER_PORT:-32000}:8080
    env_file:
      - ${SAGE_COMPOSE_ENV_FILE:-.env}
    environment:
      SAGE_DB_TYPE: mysql
      SAGE_WEB_BASE_PATH: ${SAGE_WEB_BASE_PATH:-/sage}
      SAGE_LOG_LEVEL: ${SAGE_LOG_LEVEL:-INFO}
      SAGE_SESSION_DIR: /app/sessions
      SAGE_LOGS_DIR_PATH: /app/logs
      SAGE_AGENTS_DIR: /app/agents
      SAGE_SKILL_WORKSPACE: /app/skills
      SAGE_USER_DIR: /app/users
      SAGE_LOCAL_LINUX_ISOLATION: bwrap
    labels: *sage-observability-labels
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: 4g
    cpus: 2.0
    extra_hosts:
      - "mcp.withling.top:host-gateway"
      - "host.docker.internal:host-gateway"

  sage-web:
    restart: always
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.web
      args:
        NGINX_CONF: deploy/prod/nginx/nginx.conf
        VITE_SAGE_GRAFANA_URL: ${SAGE_GRAFANA_PUBLIC_URL:-http://127.0.0.1:30093}
    image: sage-web-standalone:v1.0
    container_name: sage-web_v2
    ports:
      - ${SAGE_WEB_PORT:-32001}:80
    environment:
      TZ: 'Asia/Shanghai'
    labels: *sage-observability-labels
    depends_on:
      - sage-server
