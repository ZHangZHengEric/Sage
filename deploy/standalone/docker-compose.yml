services:
  sage-server:
    restart: always
    init: true
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.server_v2
    image: sage-server:v2
    container_name: sage-server-v2
    volumes:
      - ${SAGE_ROOT:-../data/standalone}/sage-server/data:/app/data
      - ${SAGE_ROOT:-../data/standalone}/sage-server/logs:/app/logs
    ports:
      - ${SAGE_SERVER_PUBLISHED_PORT:-32000}:8090
    env_file:
      - ${SAGE_COMPOSE_ENV_FILE:-.env}
    environment:
      SAGE_SERVER_MYSQL_URL: ${SAGE_SERVER_MYSQL_URL:?Set SAGE_SERVER_MYSQL_URL using the v2 env template}
      SAGE_SERVER_JWT_SECRET: ${SAGE_SERVER_JWT_SECRET:?Set SAGE_SERVER_JWT_SECRET using the v2 env template}
      SAGE_SERVER_HOST: 0.0.0.0
      SAGE_SERVER_PORT: 8090
      SAGE_SERVER_DATA: /app/data
      SAGE_SERVER_LOG_DIRECTORY: /app/logs
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      # Nested bubblewrap mounts a private procfs in its own PID/user namespace.
      # Docker's masked /proc submounts otherwise make the kernel reject it.
      - systempaths=unconfined
    mem_limit: 4g
    cpus: 2.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  sage-web:
    restart: always
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.web_v2
    image: sage-web:v2
    container_name: sage-web-v2
    ports:
      - ${SAGE_WEB_PORT:-32001}:80
    depends_on:
      sage-server:
        condition: service_healthy
