stages:
  - build
  - release

variables:
  TAURI_VERSION: "2.0.0"
  NODE_VERSION: "22.12.0"
  RUST_VERSION: "1.77.2"

cache:
  paths:
    - app/v1/desktop/ui/node_modules/
    - app/v1/desktop/tauri/target/

build-macos:
  stage: build
  tags:
    - macos
  script:
    - echo "Building for macOS..."
    - source $HOME/.bash_profile
    - rustup update stable
    - npm install -g @tauri-apps/cli@^2
    - bash app/v1/desktop/scripts/build.sh release
  artifacts:
    paths:
      - app/v1/desktop/tauri/target/release/bundle/dmg/*.dmg
      - app/v1/desktop/tauri/target/release/bundle/macos/*.app

build-windows:
  stage: build
  tags:
    - windows
  script:
    - echo "Building for Windows..."
    - powershell -NoProfile -ExecutionPolicy Bypass -File app/v1/desktop/scripts/build_windows.ps1 release
  artifacts:
    paths:
      - app/v1/desktop/tauri/target/release/bundle/msi/*.msi
      - app/v1/desktop/tauri/target/release/bundle/nsis/*.exe
