x-sage-observability-labels: &sage-observability-labels
  com.sage.environment: ${SAGE_OBSERVABILITY_ENV:-${SAGE_ENV:-development}}

services:
  sage-server-dev:
    restart: always
    init: true
    build:
      context: ../../../..
      dockerfile: app/v1/deploy/images/Dockerfile.server
    image: sage-server-dev:v1.0
    container_name: sage-server-dev
    volumes:
      - ${SAGE_ROOT}/sage-server/sessions:/app/sessions
      - ${SAGE_ROOT}/sage-server/agents:/app/agents
      - ${SAGE_ROOT}/sage-server/logs:/app/logs
      - ${SAGE_ROOT}/sage-server/data:/app/data
      - ${SAGE_ROOT}/sage-server/skills:/app/skills
      - ${SAGE_ROOT}/sage-server/users:/app/users
    ports:
      - ${SAGE_SERVER_PORT:-30150}:8080
    env_file:
      - ${SAGE_COMPOSE_ENV_FILE:-.env}
    environment:
      SAGE_WEB_BASE_PATH: ${SAGE_WEB_BASE_PATH:-/sage}
      SAGE_TRACE_JAEGER_URL: ${SAGE_TRACE_JAEGER_URL:-}
      SAGE_TRACE_JAEGER_PUBLIC_URL: ${SAGE_TRACE_JAEGER_PUBLIC_URL:-}
      SAGE_LOG_LEVEL: ${SAGE_LOG_LEVEL:-INFO}
      SAGE_SESSION_DIR: /app/sessions
      SAGE_LOGS_DIR_PATH: /app/logs
      SAGE_AGENTS_DIR: /app/agents
      SAGE_SKILL_WORKSPACE: /app/skills
      SAGE_USER_DIR: /app/users
      SAGE_LOCAL_LINUX_ISOLATION: bwrap
    labels: *sage-observability-labels
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: 16g
    cpus: 4.0
    extra_hosts:
      - "mcp.withling.top:host-gateway"
    networks:
      default:
        aliases:
          - sage-server
      shared: {}
      ling_shared:
        aliases:
          - sage.internal
          - sage-server

  sage-web-dev:
    restart: always
    build:
      context: ../../../..
      dockerfile: app/v1/deploy/images/Dockerfile.web
      args:
        NGINX_CONF: app/v1/deploy/dev/nginx/nginx.conf
        VITE_SAGE_GRAFANA_URL: ${SAGE_GRAFANA_PUBLIC_URL:-}
    image: sage-web-dev:v1.0
    container_name: sage-web-dev
    ports:
      - ${SAGE_WEB_PORT:-30151}:80
    environment:
      TZ: 'Asia/Shanghai'
    labels: *sage-observability-labels
    mem_limit: 512m
    cpus: 0.5
    networks:
      default: {}
      shared: {}

networks:
  shared:
    name: ${SAGE_SHARED_NETWORK:-sage_shared_default}
    external: true
  ling_shared:
    name: ${LING_SHARED_NETWORK:-ling_shared_default}
    external: true
