[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "2.1.1"
description = "A platform for custom, self-evolving AI agents with multi-round RSI, Desktop, Server, and Python APIs."
readme = "README.md"
# Sage 2.0 applications and runtime require Python 3.12+.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Eric ZZ" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
# Default Sage runtime (v2), CLI and independent AnyTool MCP server.
# Unversioned extras below select the current applications.
# Legacy v1 applications install app/v1/requirements.txt explicitly; see app/v1/README.md.
dependencies = [
  "openai>=1.0.0",
  "httpx>=0.24.0",
  "pydantic>=2.5.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20.0",
  "mcp==1.28.1",
  "anyio>=4.0.0",
  "Pillow>=10.0.0",
  "psutil>=5.9.0",
  "python-dotenv>=1.0.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0", "SQLAlchemy[asyncio]>=2.0,<2.2"]
redis = ["redis>=5.0.0"]
cube = ["cubesandbox>=0.6.0,<1"]
otel = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp>=1.20.0",
]
server = [
  "ag-ui-protocol==0.1.19",
  "fastapi>=0.115.2",
  "uvicorn[standard]>=0.24.0",
  "uvloop>=0.21.0; sys_platform != 'win32'",
  "starlette>=0.40.0",
  "PyJWT>=2.8.0,<3",
  "redis>=5.0.0",
  "aiomysql>=0.2.0",
  "SQLAlchemy[asyncio]>=2.0,<2.2",
  "prometheus-client>=0.20.0",
  "a2a-sdk[fastapi]>=1.1.4,<2",
]
desktop = [
  "fastapi>=0.115.2",
  "uvicorn[standard]>=0.24.0",
  "uvloop>=0.21.0; sys_platform != 'win32'",
  "starlette>=0.40.0",
  "python-pptx>=0.6.22",
]
# A2A remains optional for standalone runtime and Desktop installations.
a2a = ["a2a-sdk[fastapi]>=1.1.4,<2"]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "pytest-timeout>=2.3.0",
  "fakeredis>=2.38.0,<3",
  "aiosqlite>=0.21.0",
]
# Optional text-only vendored tau-bench runtime; the base Sage install stays small.
tau-bench = [
  "litellm==1.82.6",
  "deepdiff==9.1.0",
  "addict==2.4.0",
  "numpy>=1.24.0",
  "pandas>=2.2.3",
  "tenacity>=9.0.0",
  "docstring-parser>=0.16",
  "rich>=13.0.0",
  "tiktoken>=0.8.0",
  "pydub>=0.25.1",
]
dev = ["build>=1.0", "ruff==0.15.14"]

[project.urls]
Homepage = "https://github.com/ZHangZHengEric/Sage"

[project.scripts]
sage = "app.clients.cli.main:main"
sage-rsi-mcp = "app.v2.cli.rsi_mcp:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sagents*", "app", "app.v1*", "app.v2", "app.v2.cli*", "app.v2.server*", "app.v2.desktop", "app.v2.desktop.backend*", "app.clients*", "mcp_servers.anytool*", "evaluation_datasets*"]
exclude = ["tests*", "app.v1.desktop*", "app.skills*", "app.wiki*", "assets*", "logs*", "evaluation_datasets.*.vendor*", "evaluation_datasets.*.data*"]

[tool.setuptools.data-files]
"share/sage/docs/en" = ["docs/en/*.md"]
"share/sage/docs/zh" = ["docs/zh/*.md"]

[tool.setuptools.package-data]
"evaluation_datasets" = ["**/*.json", "**/*.md", "**/*.txt", "**/*.py", "**/*.toml", "**/LICENSE"]
"app.v1" = ["requirements*.txt"]
"app.clients.terminal" = [
  "bin/*/run-sage-terminal.sh",
  "bin/*/run-sage-terminal.cmd",
  "bin/*/sage-terminal",
  "bin/*/sage-terminal.exe",
  "bin/run-sage-terminal.sh",
  "bin/run-sage-terminal.cmd",
  "bin/sage-terminal",
  "bin/sage-terminal.exe",
  "scripts/run-sage-terminal.sh",
]

"app" = ["skills/**/*"]
"app.v2.desktop.backend" = ["openui_runtime/*.cjs", "openui_runtime/*.json", "openui_runtime/*.txt", "openui_runtime/*LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
required_plugins = ["pytest-timeout>=2.3"]
# Catch hangs without treating disk-backed integration tests as benchmarks.
# Tests with timing contracts should set an explicit pytest.mark.timeout.
timeout = 30
markers = [
  "live: opt-in tests that call a real model provider and may incur cost",
]
norecursedirs = [".git", ".hg", ".tox", "dist", "build", "venv", ".venv", "__pycache__", "node_modules"]
filterwarnings = [
  'ignore:Support for class-based `config` is deprecated:DeprecationWarning',
  'ignore:The `update_forward_refs` method is deprecated:DeprecationWarning',
]
