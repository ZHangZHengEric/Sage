[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
required_plugins = pytest-timeout>=2.3
# Catch hangs without treating disk-backed integration tests as benchmarks.
# Tests with timing contracts should set an explicit pytest.mark.timeout.
timeout = 30
markers =
    live: opt-in tests that call a real model provider and may incur cost
norecursedirs = .git .hg .tox dist build venv .venv __pycache__ node_modules
filterwarnings =
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
    ignore:The `update_forward_refs` method is deprecated:DeprecationWarning
